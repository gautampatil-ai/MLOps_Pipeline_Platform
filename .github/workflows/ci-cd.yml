name: MLOps Continuous Integration & Deployment

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Code Quality & Automated Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: mlops_user
          POSTGRES_PASSWORD: mlops_password
          POSTGRES_DB: mlops_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black

      - name: Code Formatting & Lint Check
        run: |
          black --check app/ tests/
          flake8 app/ tests/ --max-line-length=120 --ignore=E203,W503

      - name: Run Pytest Suite with Coverage
        env:
          DATABASE_URL: postgresql://mlops_user:mlops_password@localhost:5432/mlops_test_db
          JWT_SECRET_KEY: test-ci-cd-secret-key-999
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing tests/

      - name: Upload Test Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build-docker:
    name: Build & Sanity Check Docker Images
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Local Cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mlops-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
